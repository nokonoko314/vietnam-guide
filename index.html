<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>ベトナム研修 完全ガイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("vn-guide-theme");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root{--bg:#f4f4f1;--panel:#fff;--panel2:#f8f8f6;--ink:#141414;--sub:#6a6a66;--line:#e6e5e0;--line2:#d4d3cd;--red:#d6312b;--yel:#f2c230;--blue:#1f5fbf;--ok:#128a5e;--chip:#f2f2ef;--top:#111;--hero:#121212;--never:#fff7f5;--neverl:#f2d6d1;--sh:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.04);--tgc-b:#e6eefb;--tgc-c:#1f4f8f;--tgo-b:#f3eee3;--tgo-c:#7a6440;--tga-b:#fde6e1;--tga-c:#a8361a;--my:#e6f5ee;--myl:#bfe3d2;--myc:#0b6b48;--mn:#fff0ee;--mnl:#f3cbc6;--mnc:#a12620;--ill:#f3f1ea;--mark:#ffe58a;color-scheme:light}
[data-theme=dark]{--bg:#0e0e0d;--panel:#171716;--panel2:#1d1d1b;--ink:#ecebe7;--sub:#9b9a94;--line:#282826;--line2:#3a3a37;--red:#ff5d52;--blue:#79adff;--ok:#41d197;--chip:#222220;--top:#090909;--hero:#1a1a19;--never:#1f1514;--neverl:#3e2421;--sh:0 1px 0 rgba(255,255,255,.02);--tgc-b:#1b2a43;--tgc-c:#a5c6ff;--tgo-b:#2d281d;--tgo-c:#dcc595;--tga-b:#3a1c18;--tga-c:#ffa596;--my:#12291f;--myl:#1f4a37;--myc:#7fe0b4;--mn:#2c1614;--mnl:#4d2420;--mnc:#ff9b8f;--ill:#e9e6dc;--mark:#6b5a12;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Inter","IBM Plex Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14.5px;line-height:1.65;transition:background .2s,color .2s;font-feature-settings:"palt" 1}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
::selection{background:var(--yel);color:#111}
/* top bar */
.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)!important;height:calc(58px + env(safe-area-inset-top))!important;padding-left:max(14px,env(safe-area-inset-left))!important;background:var(--top);color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;height:58px;border-bottom:1px solid #ffffff10}
.burger{width:40px;height:40px;border:none;background:none;cursor:pointer;display:grid;place-content:center;gap:5px;padding:0;flex:none;border-radius:10px}
.burger:hover{background:#ffffff14}
.burger i{display:block;width:20px;height:2px;background:#fff;border-radius:2px}
.brand{font:800 14.5px Inter;letter-spacing:.04em;white-space:nowrap;color:#fff}
.brand b{color:var(--yel)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;margin-left:6px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 24px),transparent);padding:0 12px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{color:#a9a9a4;padding:7px 11px;border-radius:9px;font-size:13px;white-space:nowrap;font-weight:500;transition:.15s}
.tabs a:hover{color:#fff;text-decoration:none;background:#ffffff12}
.tabs a.on{color:#111;background:#fff}
.tools{display:flex;gap:4px;align-items:center;flex:none}
.tb{height:36px;min-width:36px;padding:0 10px;border:1px solid #ffffff1f;background:#ffffff0d;color:#eee;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.tb:hover{background:#ffffff1f}
.tb kbd{font:600 10.5px Inter;color:#999;border:1px solid #ffffff26;border-radius:4px;padding:0 4px}
.tb svg{width:16px;height:16px}
.cd{font:600 11.5px Inter;color:#a9a9a4;white-space:nowrap;padding-left:6px}
@media(max-width:1100px){.cd{display:none}.tb kbd{display:none}}
@media(max-width:760px){.tabs{display:none}.brand{flex:1}.tb .lb{display:none}}
/* drawer */
.scrim{position:fixed;inset:0;background:#0008;z-index:30;opacity:0;pointer-events:none;transition:.2s;backdrop-filter:blur(2px)}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(340px,86vw);background:#111;color:#fff;z-index:31;transform:translateX(-100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:20px 14px;overflow:auto;display:flex;flex-direction:column}
.drawer.show{transform:none}
.drawer h3{font:600 10.5px Inter;letter-spacing:.18em;color:#777;margin:8px 10px 10px}
.drawer nav a{display:flex;gap:12px;align-items:center;color:#e8e8e8;padding:10px 10px;border-radius:10px;font-size:14px}
.drawer nav a:hover,.drawer nav a.on{background:#ffffff14;text-decoration:none}
.drawer nav a.on{box-shadow:inset 3px 0 0 var(--red)}
.drawer .no{font:600 11px Inter;color:#777;width:20px}
.drawer .ds{font-size:11px;color:#888;display:block;margin-top:-2px}
.drawer .close{position:absolute;right:12px;top:12px;background:none;border:none;color:#fff;font-size:22px;cursor:pointer;width:36px;height:36px;border-radius:10px}
.drawer .close:hover{background:#ffffff14}
.dfoot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid #ffffff14;display:flex;gap:8px;flex-wrap:wrap}
.dfoot .tb{flex:1;justify-content:center}
/* main */
main{max-width:1440px;margin:0 auto;padding:26px 28px 80px}
.view{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.vh{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.vh .num{font:800 12px Inter;color:var(--red);letter-spacing:.12em;width:100%;margin-bottom:-12px}
.vh h1{font-size:28px;margin:0;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.vh .lead{color:var(--sub);font-size:13px;flex:1;min-width:240px}
.pg{display:inline-flex;align-items:center;font:700 10.5px/1 Inter;background:var(--ink);color:var(--panel);border-radius:5px;padding:3px 6px;cursor:pointer;white-space:nowrap;vertical-align:2px;transition:.15s;letter-spacing:.02em}
.pg:hover{background:var(--red);color:#fff}.pg.nolink{cursor:default}.pg.nolink:hover{background:var(--ink);color:var(--panel)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.grid.g4{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.gap{margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--sh);transition:border-color .15s}
.card h2{font-size:15.5px;margin:0 0 10px;font-weight:700;display:flex;gap:10px;align-items:center;line-height:1.35}
.card h2 .k{font:800 10.5px Inter;letter-spacing:.14em;color:var(--red);flex:none}
.card p{margin:6px 0}
.card ul,.card ol{margin:6px 0;padding-left:20px}
.card li{margin:4px 0}
.card li::marker{color:var(--sub)}
.big{font:800 32px/1.05 Inter;letter-spacing:-.02em;margin:2px 0 8px}
.big small{font-size:13px;font-weight:600;color:var(--sub);margin-left:4px;letter-spacing:0}
.muted{color:var(--sub);font-size:12.5px}
.src{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px}
.src a{background:var(--chip);border:1px solid var(--line);border-radius:7px;padding:2px 8px;color:var(--ink);opacity:.85}
.src a:hover{border-color:var(--ink);text-decoration:none;opacity:1}
.src a:before{content:"↗ ";color:var(--sub)}
.warn{border-left:3px solid var(--red)}
.span2{grid-column:span 2}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,30%{box-shadow:0 0 0 3px var(--yel)}100%{box-shadow:var(--sh)}}
@media(max-width:760px){.span2{grid-column:auto}main{padding:18px 14px 80px}.vh h1{font-size:23px}}
/* home */
.hero{background:var(--hero);color:#fff;border-radius:22px;padding:30px 32px;display:grid;grid-template-columns:1.3fr 1fr;gap:28px;margin-bottom:16px;position:relative;overflow:hidden;border:1px solid #ffffff10}
.hero:after{content:"★";position:absolute;right:-18px;bottom:-74px;font-size:260px;color:var(--red);line-height:1;z-index:0;opacity:.95}
.hero>*{position:relative;z-index:2}
.hero h1{font-size:34px;margin:6px 0 10px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.hero .eb{font:700 10.5px Inter;letter-spacing:.2em;color:var(--yel)}
.hero .sub{color:#c9c9c4;font-size:13px}
.hero .facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:center}
.hero .f{background:#222;border:1px solid #ffffff12;border-radius:14px;padding:12px 14px}
.hero .f b{display:block;font:800 21px Inter;letter-spacing:-.01em}
.hero .f span{font-size:11.5px;color:#aaa}
@media(max-width:860px){.hero{grid-template-columns:1fr;padding:24px}.hero h1{font-size:28px}}
.next{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:16px;box-shadow:var(--sh);flex-wrap:wrap}
.next .lab{font:800 10.5px Inter;letter-spacing:.14em;color:var(--red)}
.next .when{font:800 20px Inter;letter-spacing:-.01em}
.next .what{font-weight:600}
.next .rest{margin-left:auto;font:600 12.5px Inter;color:var(--sub)}
.homegrid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:980px){.homegrid{grid-template-columns:1fr}}
.toc{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.toc a{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--ink);display:flex;flex-direction:column;gap:4px;min-height:112px;transition:.15s;box-shadow:var(--sh)}
.toc a:hover{border-color:var(--ink);text-decoration:none;transform:translateY(-2px)}
.toc .n{font:800 11.5px Inter;color:var(--red)}
.toc .t{font-weight:700;font-size:15px}
.toc .d{font-size:12px;color:var(--sub)}
.mini .bar{margin:8px 0 6px}
@media(max-width:520px){.toc{grid-template-columns:1fr 1fr;gap:10px}.toc a{min-height:96px;padding:13px}.toc .d{font-size:11px}.hero .eb{font-size:9.5px;letter-spacing:.12em}}
/* timeline */
.days{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);gap:14px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory}
.day{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;scroll-snap-align:start;box-shadow:var(--sh)}
.day.today{border:2px solid var(--red)}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:8px}
.day .dh b{font:800 22px Inter;letter-spacing:-.01em}
.day .dh small{font-size:12px;color:var(--sub);font-weight:600;margin-left:3px}
.day .dh span{font-size:12px;color:var(--sub)}
.ev{display:grid;grid-template-columns:54px 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.ev:last-of-type{border-bottom:none}
.ev .t{font:700 12.5px Inter;font-variant-numeric:tabular-nums}
.ev.past{opacity:.45}
.meal{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.meal span{font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--chip);border:1px solid var(--line)}
.meal span.y{background:var(--my);border-color:var(--myl);color:var(--myc)}
.meal span.n{background:var(--mn);border-color:var(--mnl);color:var(--mnc)}
.stay{margin-top:8px;font-size:12px;color:var(--sub)}
.stay.alert{color:var(--mnc)}
/* checklist */
.ck-top{position:sticky;top:58px;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:16px;box-shadow:var(--sh)}
.bar{flex:1;min-width:160px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ink),var(--ink));border-radius:99px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.bar.full i{background:var(--ok)}
.pct{font:800 22px Inter;min-width:60px;text-align:right;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line2);background:var(--panel);color:var(--ink);border-radius:10px;padding:7px 12px;font:inherit;font-size:12.5px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.save{font-size:11.5px;color:var(--sub)}
.save.ok{color:var(--ok)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
.chipf{border:1px solid var(--line2);background:var(--panel);color:var(--ink);border-radius:99px;padding:4px 12px;font-size:12px;cursor:pointer}
.chipf.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.cols{columns:3 330px;column-gap:16px}
.cols .card{break-inside:avoid;margin-bottom:16px;padding:0;overflow:hidden}
.cols .card .ch{padding:14px 16px 4px;display:flex;align-items:center;gap:8px}
.cols .card .ch h2{margin:0;flex:1}
.cols .card .ch .n{font:700 12px Inter;color:var(--sub);font-variant-numeric:tabular-nums}
.cols .card .ch .n.full{color:var(--ok)}
.cols .card .cd2{padding:0 16px 10px;font-size:12px;color:var(--sub)}
.card.research{border:2px solid var(--ink)}
.card.never{background:var(--never);border-color:var(--neverl)}
.it{display:flex;gap:10px;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer;align-items:flex-start;transition:background .12s}
.it:hover{background:var(--panel2)}
.it input{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;border:1.8px solid var(--line2);border-radius:6px;margin:1px 0 0;display:grid;place-content:center;background:var(--panel);cursor:pointer;transition:.15s}
.it input:checked{background:var(--ink);border-color:var(--ink)}
.it input:checked:after{content:"";width:5px;height:10px;border:solid var(--panel);border-width:0 2.2px 2.2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.it .tx{flex:1;min-width:0}
.it .nm{font-size:13.5px;font-weight:500}
.it.done .nm{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--line2)}
.it .nt{font-size:12px;color:var(--sub);margin-top:1px}
.tg{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:4px;margin:4px 4px 0 0;font-weight:600}
.tg.carry{background:var(--tgc-b);color:var(--tgc-c)}.tg.opt{background:var(--tgo-b);color:var(--tgo-c)}.tg.alert{background:var(--tga-b);color:var(--tga-c)}
.it .src{margin-top:5px}
.del{border:none;background:none;color:var(--sub);font-size:16px;cursor:pointer}
.hid{border:1px solid var(--line);background:var(--panel);color:var(--sub);font:inherit;font-size:11px;border-radius:6px;padding:1px 7px;cursor:pointer;flex:none;opacity:.5;transition:.15s}
.it:hover .hid{opacity:1}.hid:hover{border-color:var(--red);color:var(--red)}
@media(hover:none){.hid{opacity:.8}}
.hide-done .it.done,.f-todo .it.done,.f-carry .it:not([data-tg~="carry"]),.f-alert .it:not([data-tg~="alert"]){display:none}
.hiddenc{background:var(--panel2)}
.hiddenc .it{cursor:default;align-items:center}
.add{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.add input,.add select{font:inherit;font-size:13px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);color:var(--ink)}
.add input{flex:1;min-width:0;padding:7px 10px}
.add select{max-width:42%;padding:0 6px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;color:var(--sub);font-weight:600;letter-spacing:.04em}
tr:last-child td{border-bottom:none}
.vn{font-weight:700}
.kana{color:var(--sub);font-size:12px}
/* food */
.dish{display:flex;flex-direction:column}
.dish .ill{position:relative;background:var(--ill);border-radius:12px;margin:-6px -8px 12px;padding:6px 10px;height:150px;display:flex;align-items:center;justify-content:center}
.dish .ill.photo{padding:0;overflow:hidden;height:190px;background:#222}.dish .ill.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}.dish:hover .ill.photo img{transform:scale(1.04)}.dish .credit{font-size:10.5px;color:var(--sub);margin:-6px 0 8px}.dish .credit a{color:var(--sub);text-decoration:underline}.dish .ill svg{height:100%;width:auto;max-width:100%}
.dish .cat{position:absolute;left:10px;top:9px;font:700 10.5px Inter;background:#141414;color:#fff;border-radius:5px;padding:1px 7px}
.dish .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px;margin:2px 0 6px}
.dish .meta span{background:var(--chip);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.dish .src{margin-top:auto;padding-top:10px}
.food .vnn{font:700 12px Inter;color:var(--red);letter-spacing:.03em}
/* pdf */
.pdfwrap{display:grid;grid-template-columns:132px 1fr;gap:14px;height:calc(100vh - 200px);min-height:480px}
.thumbs{overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.thumbs button{border:2px solid transparent;border-radius:9px;padding:0;background:#fff;cursor:pointer;position:relative;flex:none}
.thumbs button.on{border-color:var(--red)}
.thumbs img{width:100%;display:block;border-radius:7px}
.thumbs span{position:absolute;left:4px;top:4px;font:700 10px Inter;background:#141414;color:#fff;border-radius:4px;padding:0 5px}
.viewer{background:#262624;border-radius:16px;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:18px}
.viewer img{max-width:100%;height:auto;box-shadow:0 8px 30px #0007;background:#fff;border-radius:2px}
.vbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.vbar .lbl{font:700 13px Inter;min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
@media(max-width:760px){.pdfwrap{grid-template-columns:1fr;height:auto}.thumbs{flex-direction:row;overflow-x:auto;height:112px}.thumbs button{flex:0 0 74px}}
/* overlays */
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal.show{display:flex}
.modal .box{background:var(--panel);color:var(--ink);border-radius:16px;padding:22px;max-width:360px;border:1px solid var(--line)}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.sov{position:fixed;inset:0;background:#000a;z-index:45;display:none;justify-content:center;align-items:flex-start;padding:10vh 16px 16px;backdrop-filter:blur(3px)}
.sov.show{display:flex}
.sbox{width:min(700px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px #0006;overflow:hidden;display:flex;flex-direction:column;max-height:76vh}
.sin{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sin svg{width:18px;height:18px;color:var(--sub);flex:none}
.sin input{flex:1;border:none;background:none;color:var(--ink);font:500 17px "Inter","IBM Plex Sans JP",sans-serif;outline:none}
.sin kbd{font:600 10.5px Inter;color:var(--sub);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
.sres{overflow:auto;padding:8px}
.sr{display:block;width:100%;text-align:left;border:none;background:none;color:var(--ink);padding:10px 12px;border-radius:10px;cursor:pointer;font:inherit}

var OFFLINE=!!window.__OFFLINE__;
var LS=OFFLINE?"vn-guide-2026-offline":"vn-guide-2026";
var state={checked:{},custom:[],hidden:{},updated:0};
try{var sd=document.getElementById("seed");if(OFFLINE&&sd){var sv=JSON.parse(sd.textContent);if(sv&&sv.checked)state=sv}}catch(e){}
try{var l=JSON.parse(localStorage.getItem(LS)||"null");if(l&&l.checked&&(l.updated||0)>=(state.updated||0))state=l}catch(e){}
if(!state.hidden)state.hidden={};if(!state.custom)state.custom=[];
var ui={filter:"all"};try{ui.filter=localStorage.getItem(LS+"-filter")||"all"}catch(e){}
var dbRef=null,saveT=null,saveMsg="この端末に保存",saveOk=true;
function setSave(m,ok){saveMsg=m;saveOk=ok;var e=document.getElementById("save");if(e){e.textContent=m;e.className="save"+(ok?" ok":"")}}
function persist(){
 state.updated=Date.now();
 try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
 if(!dbRef){setSave("この端末に保存済み",true);return}
 setSave("保存中…",false);clearTimeout(saveT);
 saveT=setTimeout(function(){
  Promise.resolve(dbRef.set({checked:state.checked,custom:state.custom,hidden:state.hidden,updated:state.updated})).then(function(){setSave("保存済み（アカウントに同期）",true)}).catch(function(){setSave("この端末に保存済み",true)});
 },600);
}
function initDb(){
 if(OFFLINE||!(window.claude&&window.claude.use))return;
 Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
  var db=r[0],user=r[1];if(!db||!user)return;
  return Promise.resolve(user.id()).then(function(id){
   if(!id)return;
   dbRef=db.collection("data/users/"+id).doc("checker");
   var timer=setTimeout(function(){},10000);
   return Promise.resolve(dbRef.get()).then(function(snap){
    clearTimeout(timer);
    var d=snap&&typeof snap.data==="function"?snap.data():(snap&&snap.data!==undefined&&snap.checked===undefined?snap.data:snap);
    if(d&&d.checked&&(d.updated||0)>=(state.updated||0)){state.checked=d.checked||{};state.custom=d.custom||[];state.hidden=d.hidden||{};state.updated=d.updated||0;try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}if(cur==="checklist")renderView("checklist");else updateBadge()}
    else if(state.updated){persist()}
    setSave("保存済み（アカウントに同期）",true);
   });
  });
 }).catch(function(){});
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function allIds(){var a=[];CATS.forEach(function(c){c.items.forEach(function(i){a.push(i[0])})});state.custom.forEach(function(x){a.push(x.id)});return a.filter(function(i){return !state.hidden[i]})}
function progress(){var ids=allIds(),c=ids.filter(function(i){return state.checked[i]}).length;return{n:ids.length,c:c,p:ids.length?Math.round(c/ids.length*100):0}}

/* ---------- converter ---------- */
var RATE_DEF=163;
function rate(){try{var r=parseFloat(localStorage.getItem("vn-guide-rate"));if(r>50&&r<400)return r}catch(e){}return RATE_DEF}
function fmt(n){return Math.round(n).toLocaleString("ja-JP")}
function num(v){return parseFloat(String(v).replace(/[^0-9.]/g,""))||0}
function convHint(vnd){var k=Math.floor(vnd/1000);return vnd?("暗算なら "+fmt(k)+" × 6 ≈ "+fmt(k*6)+" 円"):""}
function fromV(){var v=num(cvV.value);cvY.value=v?fmt(v/rate()):"";cvV.value=v?fmt(v):"";document.getElementById("cvHint").textContent=convHint(v)}
function fromY(){var y=num(cvY.value);cvV.value=y?fmt(y*rate()):"";cvY.value=y?fmt(y):"";document.getElementById("cvHint").textContent=convHint(y*rate())}

/* ---------- search ---------- */
var SIDX=null,sSel=0,sHits=[];
var SEL={checklist:".it",schedule:".day,.card"};
function selFor(v){return SEL[v]||".card,.day"}
function buildIndex(){
 SIDX=[];var keep=cur;var tmp=document.createElement("div");
 VIEWS.forEach(function(v){if(v.id==="home"||v.id==="pdf")return;cur=v.id;tmp.innerHTML=R[v.id]();
  tmp.querySelectorAll(selFor(v.id)).forEach(function(el,i){
   var t=el.querySelector("h2,.nm,.dh b");var title=t?t.textContent.replace(/^[A-Z]{2,}\s*/,""):"";
   if(v.id==="schedule"&&el.classList.contains("day"))title=el.querySelector(".dh").textContent;
   var cl=el.cloneNode(true);cl.querySelectorAll(".hid,.src,.del,button,.ill").forEach(function(x){x.remove()});var txt=cl.textContent.replace(/\s+/g," ").trim();
   SIDX.push({v:v.id,vt:v.t,sel:selFor(v.id),i:i,title:title.trim(),text:txt,lo:txt.toLowerCase()});
  });
 });
 if(!window.__NOPDF__)for(var n=1;n<=NPAGES;n++)SIDX.push({v:"pdf",vt:"しおりPDF",page:n,title:"しおり p."+n,text:"しおり p."+n+" のページを開く",lo:("しおり p."+n+" p"+n+" ページ").toLowerCase()});
 cur=keep;
}
function hl(t,terms){var e=esc(t);terms.forEach(function(q){if(!q)return;e=e.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>")});return e}
function doSearch(){
 var q=document.getElementById("sq").value.trim().toLowerCase(),box=document.getElementById("sres");
 if(!SIDX)buildIndex();
 if(!q){box.innerHTML='<div class="sempty">よく探されるキーワード</div><div class="shint">'+["両替","Wi-Fi","デビット","集合","フォー","液体","モバイルバッテリー","p.6","ひったくり","Grab"].map(function(k){return '<button class="chipf" data-q="'+k+'">'+k+'</button>'}).join("")+'</div>';box.querySelectorAll("[data-q]").forEach(function(b){b.onclick=function(){document.getElementById("sq").value=b.getAttribute("data-q");doSearch()}});sHits=[];return}
 var terms=q.split(/\s+/).filter(Boolean);
 sHits=SIDX.map(function(e){var ok=terms.every(function(t){return e.lo.indexOf(t)>=0});if(!ok)return null;var sc=0;terms.forEach(function(t){if(e.title.toLowerCase().indexOf(t)>=0)sc+=5;sc+=1});if(e.v==="pdf")sc-=3;return{e:e,sc:sc}}).filter(Boolean).sort(function(a,b){return b.sc-a.sc}).slice(0,40);
 sSel=0;
 if(!sHits.length){box.innerHTML='<div class="sempty">「'+esc(q)+'」は見つかりませんでした</div>';return}
 box.innerHTML=sHits.map(function(h,k){var e=h.e,pos=e.lo.indexOf(terms[0]),st=Math.max(0,pos-34),sn=(st?"…":"")+e.text.slice(st,st+120);return '<button class="sr'+(k===0?' sel':'')+'" data-k="'+k+'"><div class="sv">'+esc(e.vt)+'</div><div class="st">'+hl(e.title||e.vt,terms)+'</div><div class="ss">'+hl(sn,terms)+'</div></button>'}).join("");
 box.querySelectorAll(".sr").forEach(function(b){b.onclick=function(){goHit(+b.getAttribute("data-k"))}});
}
function goHit(k){var h=sHits[k];if(!h)return;var e=h.e;closeSearch();
 if(e.v==="pdf"){openPage(e.page);return}
 if(e.v==="checklist"&&ui.filter!=="all"){ui.filter="all"}
 pendingJump={sel:e.sel,i:e.i};if(cur===e.v){renderView(e.v)}else{go(e.v)}}

function doJump(){if(!pendingJump)return;var j=pendingJump;pendingJump=null;var els=document.querySelectorAll("#main "+j.sel.split(",").join(",#main "));var el=els[j.i];if(!el)return;setTimeout(function(){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")},60)}
function openSearch(){closeDrawer();closeConv();var o=document.getElementById("sov");o.classList.add("show");var i=document.getElementById("sq");i.value="";doSearch();setTimeout(function(){i.focus()},30)}
function closeSearch(){document.getElementById("sov").classList.remove("show")}
